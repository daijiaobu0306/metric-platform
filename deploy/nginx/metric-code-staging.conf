# ============================================================
# nginx 配置 — 云 staging 环境（基于 metric-code-dev.conf 改造）
#
# 与 dev 的差异：
#   - listen 28081（避 dev 28080 / 生产冲突）
#   - 后端容器名 metric-backend-staging（避免与本地 dev / 生产的 backend 重名）
#   - 静态资源缓存策略：1 天（staging 比 dev 稳定，但不像 prod 那么长）
# ============================================================

server {
    listen 80;
    server_name _;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    client_max_body_size 100M;

    access_log /var/log/nginx/metric-code-staging-access.log;
    error_log  /var/log/nginx/metric-code-staging-error.log;

    # SSO 跳转入口：浏览器拿到 /oauth2/authorization/sso 相对路径后会落到 28081，
    # nginx 把这条路径直接反代到后端 18080（不嵌 /metric-code 前缀），
    # 这样 Spring Security 拼出的 authorize URL 才能匹配上 OAuth2 client registration。
    # （关键：Host 必须用 $http_host 保留原始端口；$host 不含端口会让 Spring 拼 redirect_uri 时丢端口）
    location /oauth2/ {
        proxy_pass http://metric-backend-staging:18080;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 28081;
    }

    # SSO 回调：IdP 登录完会跳到 {baseUrl}/login/oauth2/code/sso
    # （baseUrl 由 Spring 从 Host header 推算 → 必须保留端口）
    location /login/oauth2/ {
        proxy_pass http://metric-backend-staging:18080;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 28081;
    }

    # 后端 API 反代: /metric-code/api/* → metric-backend-staging:18080/api/*
    #   容器名 metric-backend-staging（与 docker-compose.staging.yml service/container_name 一致）
    # MCP 只读服务：/metric-code/mcp/* -> http://metric-backend-staging:18080/mcp/*
    #   - proxy_pass 结尾带 /mcp/ 会剥掉 /metric-code 前缀，后端 Servlet 精确匹配 /mcp/alarm
    #   - MCP 走 Streamable HTTP，POST 可能返回 SSE 流：必须关缓冲，
    #     且 read_timeout 要大于 SDK 心跳（20s），否则长连接会被 nginx 掐断
    location /metric-code/mcp/ {
        proxy_pass http://metric-backend-staging:18080/mcp/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /metric-code/api/ {
        proxy_pass http://metric-backend-staging:18080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 前端静态资源 + SPA history 模式回退
    location /metric-code/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /metric-code/index.html;

        # staging 比 dev 稳定，但仍比 prod 频繁更新，缓存 1 天 + 1 小时 SWR
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1d;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
        }

        # index.html 自身不缓存（与 dev 同步：避免 cache 旧 hash JS 引用）
        location = /metric-code/index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # 根路径访问跳转（absolute URL 写死端口，理由同上）
    location = / {
        return 301 http://8.148.195.209:28081/metric-code/;
    }

    # Usermanager「产品服务」图标跳到 /metric-code（不带尾斜杠）会 404，
    # 这里 301 补斜杠落到 /metric-code/ 的 location。
    # 用 absolute URL 写死 host:port（return 301 相对路径会让 \$server_port
    # 拼成容器内 listen 端口 80，浏览器跟跳会丢失 28081）。
    # 2026-09-09 加 ?nosso=1 临时跳过 silent SSO（sso-callback 卡死的根因调查期间），
    # 让用户能稳定看到本地登录表单，便于排查。
    location = /metric-code {
        return 301 http://8.148.195.209:28081/metric-code/?nosso=1;
    }

    # 健康检查（给 docker compose healthcheck / 监控系统用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gitee Webhook 接收器
    #   webhook-deploy 监听 0.0.0.0:28082（systemd 服务，容器外）
    #   走 nginx 28081/gitee-webhook 反代，避免云服务商安全组单独开 28082
    #   X-Gitee-Token 必须透传（HMAC 校验在 webhook-deploy 端做）
    location = /gitee-webhook {
        proxy_pass http://host.docker.internal:28082/gitee-webhook;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Gitee-Token $http_x_gitee_token;
        proxy_set_header X-Gitee-Event $http_x_gitee_event;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
