# ============================================================
# metric-frontend 容器内的 nginx 配置（由 Dockerfile.frontend COPY 进去）
#
# 与 metric-code.conf 区分：
#   - 本文件（metric-code-internal.conf）= 容器内 nginx 用，**直接 serve dist 本地磁盘**
#   - metric-code.conf = 外部 appuser nginx 用，**proxy 到本容器 + backend 容器 + UserManager**
#
# 为什么分两个：
#   容器内 nginx 不需要 proxy 自己（循环），所以 /metric-code/ 段用 root serve
#   容器外 appuser nginx 需要把流量反代到容器，所以 /metric-code/ 段用 proxy_pass
#
# Dockerfile.frontend: COPY deploy/nginx/metric-code-internal.conf /etc/nginx/conf.d/default.conf
# ============================================================

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 100M;

    access_log /var/log/nginx/metric-code-access.log;
    error_log  /var/log/nginx/metric-code-error.log;

    # 1) 后端 API 反代（同 metric-code.conf 语义，proxy 到 docker network 里的 backend 容器）
    # MCP 只读服务：/metric-code/mcp/* -> http://backend:18080/mcp/*
    #   - proxy_pass 结尾带 /mcp/ 会剥掉 /metric-code 前缀，后端 Servlet 精确匹配 /mcp/alarm
    #   - MCP 走 Streamable HTTP，POST 可能返回 SSE 流：必须关缓冲，
    #     且 read_timeout 要大于 SDK 心跳（20s），否则长连接会被 nginx 掐断
    location /metric-code/mcp/ {
        proxy_pass http://backend:18080/mcp/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /metric-code/api/ {
        proxy_pass http://backend:18080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 2) 前端静态资源 + SPA history 模式回退（容器内本机磁盘）
    #    Dockerfile.frontend: COPY frontend/dist /usr/share/nginx/html/metric-code
    location /metric-code/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /metric-code/index.html;

        # 静态资源长期缓存（文件名带 hash，更新后自动失效）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 3) UserManager 同源反代（让容器内也能访问 UM，外部 appuser 也代理同一段）
    location /usermanager/ {
        proxy_pass http://192.168.1.12:7200/usermanager/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_read_timeout    30s;

        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 根路径跳转（容器内通常不命中；保留以防 8080 端口直接访问）
    location = / {
        return 301 /metric-code/;
    }
}
