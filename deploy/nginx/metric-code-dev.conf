# ============================================================
# nginx 配置 — 容器化前端 + 反向代理到后端容器
#
# 跟生产 deploy/nginx/metric-code.conf 一致,只把后端地址改为容器内网名
# 用 root 而非 alias,避免 alias + try_files + regex location 的组合坑
# 配合 compose 把 frontend/dist 挂到 /usr/share/nginx/html/metric-code
# ============================================================

server {
    listen 28080;
    server_name _;

    charset utf-8;
    client_max_body_size 100M;

    access_log /var/log/nginx/metric-code-access.log;
    error_log  /var/log/nginx/metric-code-error.log;

    # 后端 API 反代: /metric-code/api/* → http://backend:18080/api/*
    # MCP 只读服务：/metric-code/mcp/* -> http://backend:18080/mcp/*
    #   - proxy_pass 结尾带 /mcp/ 会剥掉 /metric-code 前缀，后端 Servlet 精确匹配 /mcp/alarm
    #   - MCP 走 Streamable HTTP，POST 可能返回 SSE 流：必须关缓冲，
    #     且 read_timeout 要大于 SDK 心跳（20s），否则长连接会被 nginx 掐断
    location /metric-code/mcp/ {
        proxy_pass http://backend:18080/mcp/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /metric-code/api/ {
        proxy_pass http://backend:18080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SSO 跳转入口：浏览器拿到 /oauth2/authorization/sso 相对路径后会落到 28080，
    # 必须转给后端容器，否则被 try_files 当 SPA 路由返回 index.html
    location /oauth2/ {
        proxy_pass http://backend:18080;

        proxy_http_version 1.1;
        # fix(sso): Host 用 $http_host 带端口，让后端 Spring 拼出的 redirect_uri 是 :28080
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # SSO 回调：IdP 登录完会跳到 {baseUrl}/login/oauth2/code/sso
    # （baseUrl 由 Spring 从请求 Host + X-Forwarded-Port 推算 → 28080）
    location /login/oauth2/ {
        proxy_pass http://backend:18080;

        proxy_http_version 1.1;
        # fix(sso): Host 用 $http_host 带端口，与 prod/staging 对齐
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 前端静态资源 + SPA history 模式回退
    # root 会自动拼接完整路径: /metric-code/foo → /usr/share/nginx/html/metric-code/foo
    location /metric-code/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /metric-code/index.html;

        # 静态资源缓存（开发环境禁用，确保每次更新即时生效）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # 根路径访问跳转
    location = / {
        return 301 /metric-code/;
    }
}
