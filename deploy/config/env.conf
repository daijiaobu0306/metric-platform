# JDK17配置（重要：不能使用系统默认JAVA_HOME，避免影响JDK8应用）
# 请根据实际JDK17安装路径修改
JAVA_HOME=/usr/local/jdk17
export PATH=$JAVA_HOME/bin:$PATH

# 数据库配置（根据实际情况修改）
DB_HOST=192.168.1.17
DB_PORT=3306
DB_NAME=system_operations_metrics
DB_USER=root
DB_PASSWORD=请替换为实际密码

# 应用配置
APP_PORT=18080

# Nginx 监听端口（前端统一入口）
FRONTEND_PORT=28080

# 文件存储目录（必须使用绝对路径！）
# 与 dev 端 files/ 目录保持一致（commit 214c1a3：统一文件存储目录到 files/ 下管理）
# dev 端: /Users/developer/metric_code/files
# prod 端: /home/appuser/metric-code2/files
UPLOAD_BASE_PATH=/home/appuser/metric-code2/files

LOG_DIR=backend/logs
