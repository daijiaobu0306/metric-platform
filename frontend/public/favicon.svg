<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#bg)"/>
  <!-- 柱状图 -->
  <rect x="12" y="36" width="8" height="18" rx="2" fill="white" opacity="0.9"/>
  <rect x="24" y="26" width="8" height="28" rx="2" fill="white" opacity="0.9"/>
  <rect x="36" y="18" width="8" height="36" rx="2" fill="white" opacity="0.9"/>
  <rect x="48" y="12" width="8" height="42" rx="2" fill="white" opacity="0.9"/>
  <!-- 上升趋势线 -->
  <polyline points="12,34 26,24 38,16 50,10" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="10" r="3" fill="#FFD700"/>
</svg>
